name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Prepublish checks
        run: npm run prepublishOnly

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Requires repository secret NPM_TOKEN (npm Automation access token
          # with publish permission).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
